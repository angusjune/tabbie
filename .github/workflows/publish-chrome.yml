name: Publish Chrome extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_existing_package:
        description: Submit the package already uploaded to the Chrome Web Store
        required: false
        type: boolean
        default: false

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension
        run: yarn build

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./dist/manifest.json').version")"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version v${version}"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Package extension
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          (
            cd dist
            zip -qr "../release/tabbie-${VERSION}.zip" .
          )

          package_path="release/tabbie-${VERSION}.zip"
          packaged_version="$(unzip -p "${package_path}" manifest.json | jq -r .version)"

          if [[ "${packaged_version}" != "${VERSION}" ]]; then
            echo "::error::Packaged manifest version ${packaged_version} does not match ${VERSION}"
            exit 1
          fi

          echo "path=${package_path}" >> "${GITHUB_OUTPUT}"

      - name: Save release package
        uses: actions/upload-artifact@v7
        with:
          name: tabbie-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Upload package to Chrome Web Store
        if: ${{ github.event_name != 'workflow_dispatch' || ! inputs.publish_existing_package }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          item="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          upload_url="https://chromewebstore.googleapis.com/upload/v2/${item}:upload"
          status_url="https://chromewebstore.googleapis.com/v2/${item}:fetchStatus"
          response_file="${RUNNER_TEMP}/cws-upload-response.json"

          print_response() {
            if [[ ! -s "$1" ]]; then
              echo "(empty response body)"
            elif ! jq . "$1"; then
              echo "::warning::Chrome Web Store returned a non-JSON response"
              sed -n '1,200p' "$1"
            fi
          }

          if ! http_status="$(
            curl --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Content-Type: application/zip" \
              --upload-file "${PACKAGE_PATH}" \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              "${upload_url}"
          )"; then
            echo "::error::Chrome Web Store upload request failed"
            print_response "${response_file}"
            exit 1
          fi

          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Chrome Web Store upload returned HTTP ${http_status}"
            print_response "${response_file}"
            exit 1
          fi

          state="$(jq -r '.uploadState // empty' "${response_file}")"

          for attempt in {1..30}; do
            if [[ "${state}" == "SUCCEEDED" ]]; then
              break
            fi

            if [[ "${state}" != "IN_PROGRESS" && "${state}" != "UPLOAD_IN_PROGRESS" ]]; then
              echo "::error::Chrome Web Store upload failed with state: ${state:-unknown}"
              print_response "${response_file}"
              exit 1
            fi

            sleep 5
            if ! http_status="$(
              curl --silent --show-error \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                "${status_url}"
            )"; then
              echo "::error::Chrome Web Store status request failed"
              print_response "${response_file}"
              exit 1
            fi

            if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Chrome Web Store status returned HTTP ${http_status}"
              print_response "${response_file}"
              exit 1
            fi

            state="$(jq -r '.lastAsyncUploadState // empty' "${response_file}")"
          done

          if [[ "${state}" != "SUCCEEDED" ]]; then
            echo "::error::Chrome Web Store upload did not finish within 150 seconds"
            exit 1
          fi

      - name: Submit for review and automatic publishing
        id: publish
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          item="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          response_file="${RUNNER_TEMP}/cws-publish-response.json"

          print_response() {
            if [[ ! -s "$1" ]]; then
              echo "(empty response body)"
            elif ! jq . "$1"; then
              echo "::warning::Chrome Web Store returned a non-JSON response"
              sed -n '1,200p' "$1"
            fi
          }

          if ! http_status="$(
            curl --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              "https://chromewebstore.googleapis.com/v2/${item}:publish"
          )"; then
            echo "::error::Chrome Web Store publish request failed"
            print_response "${response_file}"
            exit 1
          fi

          print_response "${response_file}"

          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Chrome Web Store publish returned HTTP ${http_status}"
            exit 1
          fi

          state="$(jq -r '.state // "unknown"' "${response_file}")"
          echo "state=${state}" >> "${GITHUB_OUTPUT}"

      - name: Write release summary
        env:
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISH_STATE: ${{ steps.publish.outputs.state }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Chrome Web Store release"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Submission state: \`${PUBLISH_STATE}\`"
            echo "- Extension: https://chromewebstore.google.com/detail/${CWS_EXTENSION_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
